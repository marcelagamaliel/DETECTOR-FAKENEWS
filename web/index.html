<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Detector de Fake News</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>Faça sua análise</h1>
    <p>Digite abaixo uma notícia para verificar se é <strong>real</strong> ou <strong>fake</strong>.</p>
    <form id="form" onsubmit="handleSubmit(event)">
      <textarea id="newsInput" placeholder="Cole aqui o texto da notícia..." required></textarea>
      <button type="submit">Analisar</button>
    </form>
    <div id="result"></div>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
